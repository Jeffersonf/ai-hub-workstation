<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Comparação Lado a Lado · AI Quota Dock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #0f172a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 10;
    }
    .badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .prompt-box {
      flex: 1;
      max-width: 650px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 4px 8px 4px 14px;
    }
    .prompt-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .prompt-input::placeholder { color: #64748b; }
    .btn {
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #2563eb;
      color: #fff;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
    .split-container {
      flex: 1;
      display: flex;
      width: 100%;
      height: calc(100vh - 56px);
    }
    .panel {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .panel:first-child {
      border-right: 2px solid rgba(255, 255, 255, 0.1);
    }
    webview {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="badge" id="leftBadge">IA 1</div>
    
    <div class="prompt-box">
      <input type="text" id="promptInput" class="prompt-input" placeholder="Digite uma pergunta para copiar e testar em ambas as IAs..." />
      <button class="btn btn-primary" id="copyBtn">Copiar Pergunta</button>
    </div>

    <div class="badge" id="rightBadge">IA 2</div>
  </header>

  <div class="split-container">
    <div class="panel">
      <webview id="viewLeft" allowpopups></webview>
    </div>
    <div class="panel">
      <webview id="viewRight" allowpopups></webview>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const leftUrl = params.get('url1') || 'https://chatgpt.com';
    const rightUrl = params.get('url2') || 'https://claude.ai';
    const leftName = params.get('name1') || 'IA 1';
    const rightName = params.get('name2') || 'IA 2';
    const leftPart = params.get('part1') || 'default';
    const rightPart = params.get('part2') || 'default';

    document.getElementById('leftBadge').innerText = leftName;
    document.getElementById('rightBadge').innerText = rightName;

    const vLeft = document.getElementById('viewLeft');
    const vRight = document.getElementById('viewRight');

    vLeft.setAttribute('partition', 'persist:' + leftPart);
    vLeft.setAttribute('src', leftUrl);

    vRight.setAttribute('partition', 'persist:' + rightPart);
    vRight.setAttribute('src', rightUrl);

    const input = document.getElementById('promptInput');
    const copyBtn = document.getElementById('copyBtn');

    copyBtn.onclick = () => {
      const txt = input.value.trim();
      if (!txt) return;
      navigator.clipboard.writeText(txt);
      copyBtn.innerText = 'Copiado!';
      setTimeout(() => copyBtn.innerText = 'Copiar Pergunta', 1800);
    };

    input.onkeydown = (e) => {
      if (e.key === 'Enter') {
        copyBtn.click();
      }
    };
  </script>
</body>
</html>
